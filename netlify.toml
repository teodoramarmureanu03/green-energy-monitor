[build]
  # Tell Netlify that the React/Vite app resides in the frontend subfolder
  base = "frontend"
  # Build command for Vite
  command = "npm run build"
  # Output directory generated by the build process
  publish = "dist"

[[redirects]]
  # Necessary redirect rule for Single Page Applications (React Router) to handle client-side routing on page refresh
  from = "/*"
  to = "/index.html"
  status = 200