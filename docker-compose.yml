services:
  db:
    image: postgres:16-alpine
    container_name: energy_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: energy_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - energy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy_backend
    ports:
      - "5000:8080"
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=energy_monitor;Username=postgres;Password=postgres
      # From repo-root .env (required for ENTSO-E sync).
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:?Create .env from .env.example and set ENTSOE_API_KEY}
      EntsoeApiKey: ${ENTSOE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-green-energy-monitor-dev-jwt-key-change-me-32chars!}
      PasswordPepper: ${PASSWORD_PEPPER:-green-energy-monitor-dev-password-pepper-change-me!}
      # Optional SMTP — when unset, registration creates accounts immediately.
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-465}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:-noreply@green-energy-monitor.local}
      Email__FromName: Green Energy Monitor
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: energy_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  energy_pgdata:
