# Render blueprint: managed Postgres + backend API.
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo.
# After first deploy, set on the web service:
#   ENTSOE_API_KEY, JWT_SECRET, ALLOWED_ORIGINS (frontend URL),
#   MAILJET_API_KEY, MAILJET_SECRET_KEY,
#   Email__FromAddress (validated Mailjet sender),
#   FRONTEND_BASE_URL, EMAIL_BYPASS=false

databases:
  - name: energy-monitor-db
    plan: free
    databaseName: energy_monitor
    user: energy

services:
  - type: web
    name: energy-monitor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: JWT_SECRET
        generateValue: true
      - key: ENTSOE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: EMAIL_BYPASS
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: energy-monitor-db
          property: connectionString
